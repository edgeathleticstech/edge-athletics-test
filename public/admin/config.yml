backend:
  name: github
  repo: edgeathleticstech/edge-athletics-test
  branch: main
  base_url: https://sveltia-cms-auth.icy-hat-1de2.workers.dev
  logo:
  src: /images/edge_logo_navy.svg
  show_in_header: true

  app_title: Edge Athletics
  site_url: https://edge-athletics-test.icy-hat-1de2.workers.dev

media_folder: "public/images"
public_folder: "/images"

media_libraries:
  default:
    config:
      max_file_size: 10000000   # 10MB ceiling on what can be uploaded
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "banners"
        label: "Alert Banners"
        file: "src/data/banners.json"
        format: "json"
        fields:
          - label: "Top Alert Banner"
            name: "top"
            widget: "object"
            fields:
              - { label: "Active", name: "active", widget: "boolean", default: false, hint: "Turn on to show this banner on every page" }
              - { label: "Message", name: "message", widget: "string", required: false, hint: "One short line" }
              - { label: "Link label", name: "link_label", widget: "string", required: false, hint: "Optional — the words people click, e.g. View details" }
              - { label: "Link URL", name: "link_url", widget: "string", required: false }
              - { label: "Show from", name: "show_from", widget: "datetime", format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false, picker_utc: false, required: false, hint: "Leave blank to start showing right away" }
              - { label: "Hide after", name: "hide_after", widget: "datetime", format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false, picker_utc: false, required: false, hint: "Leave blank to show until you turn it off" }
          - label: "Secondary Banner"
            name: "secondary"
            widget: "object"
            fields:
              - { label: "Active", name: "active", widget: "boolean", default: false, hint: "Turn on to show this banner on the homepage" }
              - { label: "Message", name: "message", widget: "string", required: false, hint: "One short line — for news worth noticing but not urgent" }
              - { label: "Link label", name: "link_label", widget: "string", required: false }
              - { label: "Link URL", name: "link_url", widget: "string", required: false }
              - { label: "Show from", name: "show_from", widget: "datetime", format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false, picker_utc: false, required: false, hint: "Leave blank to start showing right away" }
              - { label: "Hide after", name: "hide_after", widget: "datetime", format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false, picker_utc: false, required: false, hint: "Leave blank to show until you turn it off" }

  - name: "announcements"
    label: "Announcements"
    folder: "src/content/announcements"
    create: true
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Publish", name: "active", widget: "boolean", default: true, hint: "Turn off to save as draft without showing on the website" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false }
      - { label: "Urgent?", name: "urgent", widget: "boolean", default: false, hint: "Mark as urgent to highlight this announcement" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "programs"
    label: "Programs"
    folder: "src/content/programs"
    create: true
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Publish", name: "active", widget: "boolean", default: true, hint: "Turn off to save as draft without showing on the website" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", hint: "Short description shown in program listings" }
      - { label: "Season", name: "season", widget: "string", hint: "e.g., Fall 2025, Summer 2026, Spring 2026" }
      - { label: "Age Range", name: "ageRange", widget: "string", required: false, hint: "e.g., 9-17 or 6-15" }
      - { label: "Dates", name: "dates", widget: "string", required: false, hint: "e.g., 4 weeks, two sessions per week" }
      - { label: "Tuition", name: "tuition", widget: "string", required: false, hint: "e.g., $225 or $195 per week" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Registration URL", name: "registrationUrl", widget: "string", required: false, hint: "Link to registration page (e.g., Knack)" }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        hint: "Add as many photos as you want — click 'Add' for each new image"
        field:
          label: "Image"
          name: "image"
          widget: "image"
      - label: "YouTube Videos"
        name: "videos"
        widget: "list"
        required: false
        hint: "Add YouTube video URLs — click 'Add' for each new video"
        field:
          label: "YouTube URL"
          name: "url"
          widget: "string"
      - { label: "Password Protect?", name: "protected", widget: "boolean", default: false, hint: "Turn on to require a password to view this page" }
      - { label: "Page Password", name: "pagePassword", widget: "string", required: false, hint: "Password visitors must enter to see this page (only used if Password Protect is on)" }
      - { label: "Display Order", name: "order", widget: "number", default: 0, hint: "Lower numbers appear first" }
      - { label: "Full Description", name: "body", widget: "markdown", hint: "Detailed program information — features, who it's for, FAQ, etc." }

  - name: "schedules"
    label: "Schedule"
    folder: "src/content/schedules"
    create: true
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Publish", name: "active", widget: "boolean", default: true, hint: "Turn off to save as draft without showing on the website" }
      - { label: "Title", name: "title", widget: "string", hint: "e.g., 14u Practice or 15u vs Hudson Valley Hawks" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false }
      - { label: "Team", name: "team", widget: "string", hint: "e.g., 14u, 12u East, 15u" }
      - { label: "Time", name: "time", widget: "string", hint: "e.g., 6:00 PM - 8:00 PM" }
      - { label: "Location", name: "location", widget: "string" }
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Practice", value: "practice" }
          - { label: "Game", value: "game" }
          - { label: "Tournament", value: "tournament" }
          - { label: "Event", value: "event" }
        default: "practice"
      - { label: "Notes", name: "notes", widget: "string", required: false, hint: "Optional — arrival time, jersey color, etc." }
